name: SEC Incremental Collection
on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Company offset (ordered by CIK)'
        default: '0'
      limit:
        description: 'Maximum companies in this batch (up to 100)'
        default: '100'
permissions:
  contents: write
concurrency:
  group: sec-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[analytics]'
      - name: Require SEC contact secret
        run: test -n "$SEC_USER_AGENT"
      - name: Determine shard
        id: shard
        env:
          INPUT_OFFSET: ${{ inputs.offset }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          limit = min(100, max(1, int(os.environ.get('INPUT_LIMIT') or '100')))
          # Daily runs sweep successive shards of 100, then wrap around.
          offset = int(os.environ.get('INPUT_OFFSET') or ((int(os.environ['GITHUB_RUN_NUMBER'])-1) % 150)*100)
          if offset < 0: raise ValueError('offset must be nonnegative')
          print(f'offset={offset}')
          print(f'limit={limit}')
          print(f'asset=sec-shard-{offset}-{limit}.sqlite.gz')
          PY
      - name: Restore previous persistent shard
        env:
          ASSET: ${{ steps.shard.outputs.asset }}
        run: |
          mkdir -p data
          gh release download historical-sec-data --pattern "$ASSET" --dir data || true
          if [ -f "data/$ASSET" ]; then gzip -dc "data/$ASSET" > data/fundamentals.sqlite; fi
      - run: python -m fundamental_database.cli companies
      - name: Collect batch
        id: collect
        continue-on-error: true
        run: python -m fundamental_database.cli collect --offset '${{ steps.shard.outputs.offset }}' --limit '${{ steps.shard.outputs.limit }}' --continue-on-error
      - name: Audit and rank
        run: |
          python -m fundamental_database.cli audit | tee data/audit.json
          python -m fundamental_database.cli rank
      - name: Export Parquet
        run: python -m fundamental_database.cli export
      - name: Persist historical shard in GitHub Release
        if: steps.collect.outcome == 'success'
        env:
          ASSET: ${{ steps.shard.outputs.asset }}
        run: |
          gzip -c data/fundamentals.sqlite > "data/$ASSET"
          gh release view historical-sec-data >/dev/null 2>&1 || gh release create historical-sec-data --title 'Historical SEC Data Shards' --notes 'Persistent per-batch SEC financial snapshots. Assets are overwritten only by the corresponding batch.'
          gh release upload historical-sec-data "data/$ASSET" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-fundamentals-${{ github.run_id }}
          path: data/
          retention-days: 30
      - name: Fail on systemic collection errors
        if: steps.collect.outcome != 'success'
        run: exit 1
