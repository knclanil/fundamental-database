name: SEC Incremental Collection
on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Company offset (ordered by CIK)'
        default: '0'
      limit:
        description: 'Maximum companies in this batch'
        default: '100'
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[analytics]'
      - name: Require SEC contact secret
        run: test -n "$SEC_USER_AGENT"
      - run: python -m fundamental_database.cli companies
      - name: Collect batch
        run: python -m fundamental_database.cli collect --offset "${{ inputs.offset || '0' }}" --limit "${{ inputs.limit || '100' }}" --continue-on-error
      - run: python -m fundamental_database.cli audit
        if: always()
      - run: python -m fundamental_database.cli export
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-fundamentals-${{ github.run_id }}
          path: data/
          retention-days: 30
