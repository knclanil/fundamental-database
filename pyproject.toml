[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fundamental-database"
version = "1.0.0"
description = "Point-in-time SEC financial facts ingestion, normalization and analytics"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]
[project.optional-dependencies]
analytics = ["duckdb>=1.0", "pyarrow>=15"]
dev = ["pytest>=7"]
[project.scripts]
fundamentals = "fundamental_database.cli:main"
[tool.setuptools.packages.find]
include = ["fundamental_database*"]
